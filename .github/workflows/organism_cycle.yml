name: ORGANISM Wake Cycle

on:
  workflow_dispatch:
    inputs:
      event_text:
        description: "Incoming stimulus text for this wake cycle"
        required: false
        default: "calc: 21 * 2"
      event_source:
        description: "Source identifier"
        required: false
        default: "github_actions_dispatch"
      mode:
        description: "Reasoning mode (auto | deterministic_only | gemini_assisted)"
        required: false
        default: "auto"
  schedule:
    # Conservative 6-hour discrete wake cycle
    - cron: "0 */6 * * *"

concurrency:
  group: organism-state-persistence
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  wake-cycle:
    runs-on: ubuntu-latest
    env:
      ORGANISM_STATE_DIR: ${{ runner.temp }}/organism_state
      ENCRYPTED_DIR: ${{ runner.temp }}/encrypted_state
    steps:
      - name: Checkout code branch
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Restore encrypted state from organism-state branch
        run: |
          mkdir -p "$ENCRYPTED_DIR" "$ORGANISM_STATE_DIR"
          git config user.name "organism-runner[bot]"
          git config user.email "organism-runner[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin organism-state >/dev/null 2>&1; then
            git fetch origin organism-state
            git checkout -B organism-state-tmp origin/organism-state
            if [ -d encrypted_state ]; then
              cp -r encrypted_state/. "$ENCRYPTED_DIR"/
            fi
            git checkout "${{ github.ref_name }}"
          fi

      - name: Decrypt and verify state integrity (fail-closed)
        env:
          ORGANISM_STATE_ENCRYPTION_KEY: ${{ secrets.ORGANISM_STATE_ENCRYPTION_KEY }}
        run: |
          python3 main.py --state-dir "$ORGANISM_STATE_DIR" state-unpack --encrypted-dir "$ENCRYPTED_DIR" --allow-empty

      - name: Run automated Stage 1-3 verification tests
        run: |
          python3 -m unittest discover -s organism/tests -v

      - name: Resume interrupted work or execute wake cycle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INPUT_EVENT_TEXT: ${{ github.event.inputs.event_text }}
          INPUT_EVENT_SOURCE: ${{ github.event.inputs.event_source }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          OP_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          EVENT_TEXT="${INPUT_EVENT_TEXT:-Scheduled wake check: verify state integrity and report status?}"
          EVENT_SOURCE="${INPUT_EVENT_SOURCE:-github_actions_schedule}"
          MODE="${INPUT_MODE:-auto}"
          python3 main.py --state-dir "$ORGANISM_STATE_DIR" resume >/dev/null
          python3 main.py --state-dir "$ORGANISM_STATE_DIR" wake \
            --event "$EVENT_TEXT" \
            --source "$EVENT_SOURCE" \
            --trust trusted_operator \
            --operation-id "$OP_ID" \
            --mode "$MODE" >/dev/null

      - name: Encrypt state bundle (SQLite WAL backup + SHA-256)
        env:
          ORGANISM_STATE_ENCRYPTION_KEY: ${{ secrets.ORGANISM_STATE_ENCRYPTION_KEY }}
        run: |
          python3 main.py --state-dir "$ORGANISM_STATE_DIR" state-pack --encrypted-dir "$ENCRYPTED_DIR" --verify-no-plaintext

      - name: Persist encrypted-only state to organism-state branch
        run: |
          if git ls-remote --exit-code --heads origin organism-state >/dev/null 2>&1; then
            git fetch origin organism-state
            git checkout -B organism-state origin/organism-state
          else
            git checkout --orphan organism-state
            git rm -rf . >/dev/null 2>&1 || true
          fi
          rm -rf state encrypted_state
          mkdir -p encrypted_state
          cp -r "$ENCRYPTED_DIR"/. encrypted_state/
          rm -rf "$ORGANISM_STATE_DIR" "$ENCRYPTED_DIR"
          git add -A encrypted_state/
          if ! git diff --cached --quiet; then
            git commit -m "chore(state): persist encrypted wake cycle ${{ github.run_id }}"
            git push origin organism-state
          else
            echo "No state changes to commit."
          fi
