name: ORGANISM Wake Cycle

on:
  workflow_dispatch:
    inputs:
      event_text:
        description: "Incoming stimulus text for this wake cycle"
        required: false
        default: "calc: 21 * 2"
        type: string
      event_source:
        description: "Source identifier"
        required: false
        default: "github_actions_dispatch"
        type: string
      mode:
        description: "Reasoning mode (auto | deterministic_only | gemini_assisted)"
        required: false
        default: "auto"
        type: string
      purge_plaintext_history:
        description: "Force rewrite ONLY organism-state branch history after encrypting active state"
        required: false
        default: false
        type: boolean
  schedule:
    # Conservative 6-hour discrete wake cycle
    - cron: "0 */6 * * *"

concurrency:
  group: organism-state-persistence
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  wake-cycle:
    runs-on: ubuntu-latest
    env:
      ORGANISM_STATE_DIR: ${{ runner.temp }}/organism_state
      ENCRYPTED_DIR: ${{ runner.temp }}/encrypted_state
      LEGACY_STATE_DIR: ${{ runner.temp }}/legacy_state
      STATE_REPO_DIR: ${{ runner.temp }}/state_repo
      ORGANISM_MODEL_NAME: gemini-3.8-flash
    steps:
      - name: Checkout code branch
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Fetch organism-state branch into isolated directory
        run: |
          mkdir -p "$ORGANISM_STATE_DIR" "$ENCRYPTED_DIR" "$LEGACY_STATE_DIR" "$STATE_REPO_DIR"
          REMOTE_URL="$(git remote get-url origin)"
          git init -q "$STATE_REPO_DIR"
          git -C "$STATE_REPO_DIR" remote add origin "$REMOTE_URL"
          if git -C "$STATE_REPO_DIR" ls-remote --exit-code --heads origin organism-state >/dev/null 2>&1; then
            git -C "$STATE_REPO_DIR" fetch origin organism-state
            git -C "$STATE_REPO_DIR" checkout -B organism-state FETCH_HEAD
            if [ -d "$STATE_REPO_DIR/encrypted_state" ]; then
              cp -r "$STATE_REPO_DIR/encrypted_state"/. "$ENCRYPTED_DIR"/
            fi
            if [ -d "$STATE_REPO_DIR/state" ]; then
              cp -r "$STATE_REPO_DIR/state"/. "$LEGACY_STATE_DIR"/
            fi
          fi

      - name: Restore encrypted state or safely migrate legacy plaintext state (fail-closed)
        env:
          ORGANISM_STATE_ENCRYPTION_KEY: ${{ secrets.ORGANISM_STATE_ENCRYPTION_KEY }}
        run: |
          python3 main.py --state-dir "$ORGANISM_STATE_DIR" state-migrate-restore \
            --encrypted-dir "$ENCRYPTED_DIR" \
            --legacy-state-dir "$LEGACY_STATE_DIR" \
            --allow-empty

      - name: Run automated Stage 1-3 verification tests
        run: |
          python3 -m unittest discover -s organism/tests -v

      - name: Resume interrupted work or execute wake cycle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INPUT_EVENT_TEXT: ${{ github.event.inputs.event_text }}
          INPUT_EVENT_SOURCE: ${{ github.event.inputs.event_source }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          OP_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          EVENT_TEXT="${INPUT_EVENT_TEXT:-Scheduled wake check: verify state integrity and report status?}"
          EVENT_SOURCE="${INPUT_EVENT_SOURCE:-github_actions_schedule}"
          MODE="${INPUT_MODE:-auto}"
          python3 main.py --state-dir "$ORGANISM_STATE_DIR" resume >/dev/null
          python3 main.py --state-dir "$ORGANISM_STATE_DIR" wake \
            --event "$EVENT_TEXT" \
            --source "$EVENT_SOURCE" \
            --trust trusted_operator \
            --operation-id "$OP_ID" \
            --mode "$MODE" >/dev/null

      - name: Encrypt state bundle (SQLite WAL backup + SHA-256)
        env:
          ORGANISM_STATE_ENCRYPTION_KEY: ${{ secrets.ORGANISM_STATE_ENCRYPTION_KEY }}
        run: |
          python3 main.py --state-dir "$ORGANISM_STATE_DIR" state-pack \
            --encrypted-dir "$ENCRYPTED_DIR" \
            --verify-no-plaintext

      - name: Publish encrypted-only state to organism-state branch and audit history
        env:
          WORKSPACE_DIR: ${{ github.workspace }}
          COMMIT_MESSAGE: "chore(state): persist encrypted wake cycle ${{ github.run_id }}"
          PURGE_PLAINTEXT_HISTORY: ${{ github.event.inputs.purge_plaintext_history || 'false' }}
        run: |
          PYTHONPATH="${WORKSPACE_DIR}" bash scripts/publish_encrypted_state.sh

      - name: Cleanup temporary plaintext state directories
        if: always()
        run: |
          rm -rf "$ORGANISM_STATE_DIR" "$ENCRYPTED_DIR" "$LEGACY_STATE_DIR" "$STATE_REPO_DIR"
