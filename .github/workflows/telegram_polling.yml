name: ORGANISM Telegram Polling

on:
  schedule:
    # GitHub Actions schedules may experience queuing delays; polling persists offset in encrypted SQLite.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      event_text:
        description: "Optional manual stimulus (leave empty for normal Telegram Bot API polling)"
        required: false
        default: ""
        type: string
      purge_plaintext_history:
        description: "Force rewrite ONLY organism-state branch history after encrypting active state"
        required: false
        default: false
        type: boolean

concurrency:
  group: organism-state-persistence
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  telegram-poll:
    runs-on: ubuntu-latest
    env:
      ORGANISM_MODEL_NAME: gemini-3.8-flash
    steps:
      - name: Checkout code branch
        uses: actions/checkout@v4

      - name: Initialize ephemeral runtime directories
        run: |
          STATE_ROOT="$RUNNER_TEMP/organism_tg_runtime"
          mkdir -p "$STATE_ROOT/organism_state" "$STATE_ROOT/encrypted_state" "$STATE_ROOT/legacy_state" "$STATE_ROOT/state_repo"
          {
            echo "ORGANISM_STATE_DIR=$STATE_ROOT/organism_state"
            echo "ENCRYPTED_DIR=$STATE_ROOT/encrypted_state"
            echo "LEGACY_STATE_DIR=$STATE_ROOT/legacy_state"
            echo "STATE_REPO_DIR=$STATE_ROOT/state_repo"
          } >> "$GITHUB_ENV"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Fetch organism-state branch into isolated directory
        env:
          GH_TOKEN: ${{ github.token }}
          WORKSPACE_DIR: ${{ github.workspace }}
        run: |
          bash scripts/fetch_state_branch.sh

      - name: Restore encrypted state or safely migrate legacy plaintext state (fail-closed)
        env:
          ORGANISM_STATE_ENCRYPTION_KEY: ${{ secrets.ORGANISM_STATE_ENCRYPTION_KEY }}
        run: |
          ALLOW_EMPTY_FLAG=""
          if [ "${STATE_BRANCH_EXISTS:-true}" = "false" ]; then
            ALLOW_EMPTY_FLAG="--allow-empty"
          fi
          python3 main.py --state-dir "$ORGANISM_STATE_DIR" state-migrate-restore \
            --encrypted-dir "$ENCRYPTED_DIR" \
            --legacy-state-dir "$LEGACY_STATE_DIR" \
            $ALLOW_EMPTY_FLAG

      - name: Run automated verification tests before Telegram polling
        run: |
          python3 -m unittest discover -s organism/tests -v

      - name: Poll Telegram updates and route authorized owner messages to CognitiveKernel
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MANUAL_EVENT_TEXT: ${{ github.event.inputs.event_text }}
          OP_ID: gha-tg-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 main.py --state-dir "$ORGANISM_STATE_DIR" telegram-poll --limit 25 --timeout 5 >/dev/null
          if [ -n "$MANUAL_EVENT_TEXT" ]; then
            python3 main.py --state-dir "$ORGANISM_STATE_DIR" wake \
              --event "$MANUAL_EVENT_TEXT" \
              --source "github_actions_telegram_dispatch" \
              --trust trusted_operator \
              --operation-id "$OP_ID" \
              --mode auto >/dev/null
          fi

      - name: Encrypt updated SQLite, snapshot, and Telegram offset
        env:
          ORGANISM_STATE_ENCRYPTION_KEY: ${{ secrets.ORGANISM_STATE_ENCRYPTION_KEY }}
        run: |
          python3 main.py --state-dir "$ORGANISM_STATE_DIR" state-pack \
            --encrypted-dir "$ENCRYPTED_DIR" \
            --verify-no-plaintext
          python3 main.py state-verify-bundle \
            --encrypted-dir "$ENCRYPTED_DIR" \
            --expected-state-dir "$ORGANISM_STATE_DIR" >/dev/null

      - name: Publish encrypted-only state to organism-state branch and audit history
        env:
          GH_TOKEN: ${{ github.token }}
          ORGANISM_STATE_ENCRYPTION_KEY: ${{ secrets.ORGANISM_STATE_ENCRYPTION_KEY }}
          WORKSPACE_DIR: ${{ github.workspace }}
          COMMIT_MESSAGE: "chore(telegram): persist encrypted cognitive state ${{ github.run_id }}"
          PURGE_PLAINTEXT_HISTORY: ${{ github.event.inputs.purge_plaintext_history || 'false' }}
        run: |
          PYTHONPATH="${WORKSPACE_DIR}" bash scripts/publish_encrypted_state.sh

      - name: Cleanup temporary plaintext state directories
        if: always()
        run: |
          rm -rf "$ORGANISM_STATE_DIR" "$ENCRYPTED_DIR" "$LEGACY_STATE_DIR" "$STATE_REPO_DIR"
